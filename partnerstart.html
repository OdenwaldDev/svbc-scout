<!doctype html>
<html lang="de">
<head><meta data-schutz="1" http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' blob:; upgrade-insecure-requests"><meta name="referrer" content="no-referrer"><script>(function(){try{if(window.top!==window.self){var h=null;try{h=window.top.location.hostname;}catch(e){}if(h===null){document.documentElement.style.display='none';}}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070b1e">
<title>Partner werden · SV/BSC Mörlenbach</title>
<link rel="icon" href="icon-192.png">
<style>
/* Beta 0.99.70 · Partner-Start: Firma suchen oder anlegen, dann startet die Präsentation.
   Für den Termin vor Ort. Zeigt nichts aus der App: keine Liste, kein Stand, keine Beträge. */
@font-face{font-family:'InterV';src:url('fonts/inter-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'BarlowC';src:url('fonts/barlowc-800.woff2') format('woff2');font-weight:800;font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:#070b1e;color:#fff;font:400 16px/1.45 'InterV',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.hg{position:fixed;inset:0;z-index:0;overflow:hidden}
.hg img{width:100%;height:100%;object-fit:cover;animation:zoom 18s ease-out both}
.hg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,30,.62) 0%,rgba(7,11,30,.38) 30%,rgba(7,11,30,.86) 68%,#070b1e 100%)}
main{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(28px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
.kopf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-top:clamp(12px,7vh,72px);animation:auf .7s .05s both}
.logo{position:relative;width:132px;height:132px;display:grid;place-items:center}
.logo img{width:88px;height:auto;position:relative;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
.logo i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(91,155,255,.16);border-top-color:#5b9bff;border-right-color:rgba(91,155,255,.45);animation:dreh 9s linear infinite}
.logo i.b{inset:13px;border-width:2px;border-color:transparent;border-bottom-color:rgba(232,116,31,.8);border-left-color:rgba(232,116,31,.3);animation-duration:13s;animation-direction:reverse}
.auge{margin:0;font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#a9c4ff}
h1{margin:0;font:800 clamp(40px,10vw,64px)/.95 'BarlowC',system-ui,sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
h1 em{font-style:inherit;color:#ff8a3c}
.feld{width:min(100%,560px);margin-top:clamp(22px,5vh,44px);animation:auf .7s .25s both}
.such{position:relative}
.such svg{position:absolute;left:18px;top:50%;width:22px;height:22px;transform:translateY(-50%);color:#a9c4ff;pointer-events:none}
.such input{width:100%;height:64px;padding:0 18px 0 52px;border-radius:18px;border:1.5px solid rgba(169,196,255,.35);background:rgba(12,18,44,.72);color:#fff;font:600 19px/1 'InterV',system-ui,sans-serif;outline:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .15s,box-shadow .15s}
.such input::placeholder{color:#9fb0d8;font-weight:500}
.such input:focus{border-color:#8fb8ff;box-shadow:0 0 0 4px rgba(91,155,255,.22)}
.liste{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.z{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 16px;border-radius:16px;border:1px solid rgba(169,196,255,.22);background:rgba(12,18,44,.78);color:#fff;font:inherit;text-align:left;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:auf .25s both;transition:transform .12s,border-color .12s,background .12s}
.z:hover{border-color:#8fb8ff;background:rgba(20,30,70,.86)}
.z:active{transform:scale(.985)}
.z:focus-visible,.kn:focus-visible,.fuss a:focus-visible{outline:3px solid #8fb8ff;outline-offset:2px}
.z b{display:block;font-weight:700;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.z small{display:block;color:#b9c6e8;font-size:13.5px}
.z .t{flex:1;min-width:0}
.z svg{flex:none;width:20px;height:20px;color:#ff8a3c}
.z.neu{border-style:dashed;border-color:rgba(255,138,60,.6)}
.z.neu b{color:#ffb27a}
.hin{margin:12px 2px 0;color:#b9c6e8;font-size:14.5px;min-height:1.45em}
.hin.rot{color:#ffb4a8}
.karte{width:min(100%,560px);margin-top:clamp(22px,5vh,44px);padding:20px;border-radius:20px;border:1px solid rgba(169,196,255,.25);background:rgba(12,18,44,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:auf .3s both}
.karte h2{margin:0 0 4px;font:800 28px/1 'BarlowC',system-ui,sans-serif;text-transform:uppercase;font-style:italic}
.karte p{margin:0 0 14px;color:#c9d4f2}
.karte label{display:block;margin:12px 0 6px;font-weight:700;font-size:14px;color:#c9d4f2}
.karte input{width:100%;height:52px;padding:0 14px;border-radius:14px;border:1.5px solid rgba(169,196,255,.35);background:rgba(7,11,30,.6);color:#fff;font:500 17px/1 'InterV',system-ui,sans-serif;outline:none}
.karte input:focus{border-color:#8fb8ff;box-shadow:0 0 0 4px rgba(91,155,255,.22)}
.reihe{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.kn{flex:1 1 160px;min-height:54px;padding:0 18px;border-radius:15px;border:0;background:#e8741f;color:#1a1206;font:800 20px/1 'BarlowC',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s}
.kn:active{transform:scale(.98)}
.kn.leise{flex:0 1 auto;background:transparent;color:#fff;border:1.5px solid rgba(169,196,255,.4)}
.kn[disabled]{opacity:.6;cursor:default}
.fuss{margin-top:auto;padding-top:28px;font-size:13px;color:#8e9cc4;text-align:center}
.fuss a{color:#b9c6e8}
/* Übergang in die Präsentation: das Wappen dreht wie beim Start der App */
#los{position:fixed;inset:0;z-index:20;background:#070b1e;display:grid;place-items:center;text-align:center;padding:24px;animation:blend .35s both}
#los .logo{width:176px;height:176px;margin:0 auto 18px}
#los .logo img{width:118px}
#los .logo i{animation-duration:1.4s;animation-timing-function:cubic-bezier(.5,.2,.5,.8)}
#los .logo i.b{animation-duration:2.1s}
#los p{margin:0;font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#a9c4ff}
#los b{display:block;margin-top:8px;font:800 clamp(30px,8vw,46px)/1 'BarlowC',system-ui,sans-serif;font-style:italic;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes auf{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dreh{to{transform:rotate(360deg)}}
@keyframes blend{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="hg" aria-hidden="true"><picture><source media="(orientation:portrait)" srcset="partner/r-nachthoch.webp"><img src="partner/r-nacht.webp" alt=""></picture></div>
<main>
  <div class="kopf">
    <div class="logo"><i aria-hidden="true"></i><i class="b" aria-hidden="true"></i><img src="partner/r-svbsc.png" alt="SV/BSC Mörlenbach" width="480" height="273"></div>
    <p class="auge">SV/BSC Mörlenbach · Fußball</p>
    <h1>Partner <em>werden</em></h1>
  </div>

  <section class="feld" id="vSuche" hidden>
    <div class="such">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Firma eingeben" aria-label="Firma suchen oder neu anlegen" aria-controls="liste">
    </div>
    <div class="liste" id="liste" role="list" aria-live="polite"></div>
    <p class="hin" id="hin"></p>
  </section>

  <section class="karte" id="vNeu" hidden>
    <h2>Neue Firma</h2>
    <p>Nur der Name ist nötig. Alles Weitere kommt später in der App dazu.</p>
    <form id="fNeu" novalidate>
      <label for="nFirma">Firma</label><input id="nFirma" name="firma" maxlength="120" autocomplete="off" required>
      <label for="nAp">Ansprechpartner (wenn bekannt)</label><input id="nAp" name="ap" maxlength="80" autocomplete="off">
      <label for="nOrt">Ort (wenn bekannt)</label><input id="nOrt" name="ort" maxlength="80" autocomplete="off">
      <p class="hin rot" id="nHin" role="alert"></p>
      <div class="reihe"><button class="kn" id="nLos" type="submit">Anlegen und starten</button><button class="kn leise" id="nZur" type="button">Zurück</button></div>
    </form>
  </section>

  <section class="karte" id="vInfo" hidden>
    <h2 id="iH"></h2>
    <p id="iT"></p>
    <div class="reihe"><a class="kn" id="iK" href="./#partnerstart"></a></div>
  </section>

  <p class="fuss"><a href="./" id="zurApp">Zur App</a></p>
</main>

<div id="los" hidden role="status"><div><div class="logo"><i aria-hidden="true"></i><i class="b" aria-hidden="true"></i><img src="partner/r-svbsc.png" alt="" width="480" height="273"></div><p>Präsentation für</p><b id="losF"></b></div></div>

<script src="vendor/supabase.js?v=beta-0.99.107"></script>
<script>
(function(){
'use strict';
const C={"url": "https://lvaukuzgcwgqipxwzabo.supabase.co", "anon": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2YXVrdXpnY3dncWlweHd6YWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTYwMTcsImV4cCI6MjEwNTczMjAxN30.jYZF8q8-SyCaWykM0wwcK58EzfTbO2VASKz1NIv1xbo"}, $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const heute=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const PFEIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
let sb=null, DECKS=[], laeuft=false;
// Auf partner.kaderwerk.pro gibt es nur diese Seite. Der Weg in die App führt dann zur Hauptadresse.
if(/^partner\./.test(location.hostname)){ const a=$('#zurApp'); a.href='https://svbsc.kaderwerk.pro/'; }

function zeig(v){ ['vSuche','vNeu','vInfo'].forEach(id=>{ $('#'+id).hidden=id!==v; }); }
function info(h,t,knopf,ziel){ $('#iH').textContent=h; $('#iT').textContent=t; const k=$('#iK'); k.textContent=knopf||''; k.hidden=!knopf; if(ziel)k.href=ziel; zeig('vInfo'); }

async function laden(){ const {data,error}=await sb.rpc('partner_decks_liste'); if(error)throw error;
  DECKS=((data&&data.decks)||[]).filter(d=>d.aktiv!==false&&d.code&&d.firma).map(d=>Object.assign({n:norm([d.firma,d.kurzname,d.branche,d.passung&&d.passung.suchnamen,d.passung&&d.passung.marke&&d.passung.marke.name].filter(Boolean).join(' '))},d)); }

async function start(){
  if(!window.supabase||!C.url){ info('Gerade nicht erreichbar','Bitte die Seite neu laden.','Neu laden',location.href); return; }
  sb=window.supabase.createClient(C.url,C.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'svbc-auth',flowType:'implicit'}});
  let s=null; try{ s=(await sb.auth.getSession()).data.session; }catch(e){}
  if(!s){ info('Bitte anmelden','Der Partner-Start ist für das Partner-Team. Melde dich einmal an, danach geht es hier weiter.','Anmelden','./#partnerstart'); return; }
  try{ await laden(); }
  catch(e){ if(e&&(e.code==='42501'||/Berechtigung/.test(e.message||''))){ info('Kein Zugang','Dein Konto hat den Partner-Bereich nicht. Die Abteilungsleitung kann ihn freischalten.','Zur App','./'); return; }
    info('Gerade nicht erreichbar','Die Firmen konnten nicht geladen werden. Bitte gleich noch einmal versuchen.','Neu laden',location.href); return; }
  zeig('vSuche'); const q=$('#q'); q.value=''; if(!matchMedia('(pointer:coarse)').matches)q.focus(); suche();
}

function treffer(t){ const w=norm(t).split(' ').filter(Boolean); if(!w.length)return [];
  return DECKS.filter(d=>w.every(x=>d.n.includes(x))).map(d=>({d,r:(d.n.startsWith(w[0])?0:(' '+d.n).includes(' '+w[0])?1:2)})).sort((a,b)=>a.r-b.r||a.d.firma.localeCompare(b.d.firma,'de')).slice(0,6).map(x=>x.d); }

function suche(){ const t=$('#q').value.trim(), L=$('#liste'), H=$('#hin'); H.className='hin';
  if(norm(t).length<2){ L.innerHTML=''; H.textContent=t?'Noch ein Buchstabe.':''; return; }
  const T=treffer(t), gleich=T.some(d=>norm(d.firma)===norm(t));
  L.innerHTML=T.map((d,i)=>'<button type="button" class="z" role="listitem" data-i="'+i+'" style="animation-delay:'+(i*35)+'ms"><span class="t"><b>'+esc(d.firma)+'</b>'+(d.branche?'<small>'+esc(d.branche)+'</small>':'')+'</span>'+PFEIL+'</button>').join('')
    +(gleich?'':'<button type="button" class="z neu" role="listitem" id="neuB"><span class="t"><b>„'+esc(t)+'“ neu anlegen</b><small>Die Firma steht danach auch in der App.</small></span>'+PLUS+'</button>');
  L.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>los(T[+b.dataset.i]));
  const nb=$('#neuB'); if(nb)nb.onclick=()=>neuAuf(t);
  H.textContent=T.length?'':'Noch nicht dabei. Du kannst die Firma gleich anlegen.'; }

function neuAuf(t){ $('#nFirma').value=t; $('#nAp').value=''; $('#nOrt').value=''; $('#nHin').textContent=''; zeig('vNeu'); $('#nAp').focus(); }

async function anlegen(e){ e.preventDefault(); if(laeuft)return; const H=$('#nHin'), firma=$('#nFirma').value.trim().replace(/\s+/g,' '); H.textContent='';
  if(firma.length<2){ H.textContent='Bitte den Namen der Firma eintragen.'; $('#nFirma').focus(); return; }
  const da=DECKS.find(d=>norm(d.firma)===norm(firma)); if(da){ los(da); return; }
  laeuft=true; const K=$('#nLos'); K.disabled=true; K.textContent='Wird angelegt …';
  try{
    const r={firma:firma,ansprechpartner:$('#nAp').value.trim()||null,ort:$('#nOrt').value.trim()||null,status:'gespraech',notiz:'Im Termin angelegt (Partner-Start).',geaendert_am:new Date().toISOString()};
    const {data:f,error}=await sb.from('sponsoren').insert(r).select('id,firma').single(); if(error)throw error;
    await laden(); const d=DECKS.find(x=>x.sponsor===f.id)||DECKS.find(x=>norm(x.firma)===norm(firma));
    if(!d){ H.textContent='Die Firma ist angelegt. Die Präsentation dazu fehlt noch, bitte in der App unter Präsentationen nachsehen.'; return; }
    laeuft=false; los(d);
  }catch(x){ H.textContent=/duplicate|unique/i.test(x.message||'')?'Diese Firma gibt es schon. Geh zurück und such nach ihr.':'Das hat gerade nicht geklappt. Bitte gleich noch einmal versuchen.'; }
  finally{ laeuft=false; K.disabled=false; K.textContent='Anlegen und starten'; }
}

// Start der Präsentation: ein Eintrag im Verlauf der Firma (einmal je Tag), dann die Reise im Vollbild
async function los(d){ if(laeuft)return; laeuft=true; $('#losF').textContent=d.firma; $('#los').hidden=false; const t0=Date.now(); let kid=null;
  if(d.sponsor){ try{ const h=heute(), {data:alt}=await sb.from('sponsor_kontakte').select('id,notiz').eq('sponsor',d.sponsor).eq('am',h).limit(30);
      const schon=(alt||[]).find(k=>/\(Partner-Start\)/.test(k.notiz||''));
      if(schon)kid=schon.id; else{ const {data:n,error}=await sb.from('sponsor_kontakte').insert({sponsor:d.sponsor,art:'sonst',am:h,notiz:'Präsentation im Termin gezeigt (Partner-Start).'}).select('id').single(); if(!error&&n)kid=n.id; } }catch(e){} }
  try{ sessionStorage.setItem('ps-kontakt',JSON.stringify({code:String(d.code).toLowerCase(),id:kid})); }catch(e){}
  const rest=Math.max(0,(matchMedia('(prefers-reduced-motion:reduce)').matches?200:1100)-(Date.now()-t0));
  setTimeout(()=>{ location.href='partner.html?reise=1#d='+encodeURIComponent(d.code); },rest); }

$('#q').addEventListener('input',suche);
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=document.querySelector('#liste .z'); if(b)b.click(); } });
$('#fNeu').addEventListener('submit',anlegen);
$('#nZur').onclick=()=>{ zeig('vSuche'); $('#q').focus(); };
// Zurück aus der Präsentation: die Seite steht wieder bereit
addEventListener('pageshow',e=>{ if(e.persisted){ laeuft=false; $('#los').hidden=true; } });
window.PS={ los:los, decks:()=>DECKS };
start();
})();
</script>
</body>
</html>
